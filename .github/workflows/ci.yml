name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rename_workers_subdomain:
        description: Rename this account's workers.dev subdomain to breadgit (requires uma-parent-deck to be its only Worker)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: npm test
      - run: npm run build
      - run: npm run test:browsers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          retention-days: 3
          if-no-files-found: error
  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist/
      - name: Confirm this is still the current main revision
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Configure workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENAME_WORKERS_SUBDOMAIN: ${{ inputs.rename_workers_subdomain }}
        run: |
          node --input-type=module <<'JS'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          async function request(path, options = {}) {
            return (await fetch(`${base}/${path}`, { ...options, headers, signal: AbortSignal.timeout(30_000) })).json();
          }
          const current = await request('subdomain');
          if (current.success && current.result?.subdomain) {
            console.log(`Using ${current.result.subdomain}.workers.dev`);
            if (process.env.RENAME_WORKERS_SUBDOMAIN === 'true' && current.result.subdomain !== 'breadgit') {
              // Renaming is account-wide; never change another site's address as a side effect.
              const scripts = await request('scripts');
              if (!scripts.success || !Array.isArray(scripts.result)) throw new Error('Cannot list Workers; the account subdomain was not changed.');
              if (scripts.result.length !== 1 || scripts.result[0].id !== 'uma-parent-deck') {
                throw new Error('Rename requires uma-parent-deck to be the account\'s only Worker. Review the other Workers in Cloudflare first.');
              }
              console.log('Confirmed uma-parent-deck is the only Worker in this account.');
              const available = await request('subdomains/breadgit');
              if (!available.success && !(available.errors?.length === 1 && available.errors[0].code === 10032)) {
                throw new Error(`Cannot reserve breadgit.workers.dev; Cloudflare error codes: ${available.errors?.map(error => error.code).join(', ') || 'unknown'}. The account subdomain was not changed.`);
              }
              const renamed = await request('subdomain', { method: 'PUT', body: JSON.stringify({ subdomain: 'breadgit' }) });
              if (!renamed.success || renamed.result?.subdomain !== 'breadgit') throw new Error('Cloudflare did not confirm the rename. Check the account subdomain before retrying.');
              const verified = await request('subdomain');
              if (!verified.success || verified.result?.subdomain !== 'breadgit') throw new Error('Could not verify the new account subdomain.');
              console.log('Renamed and verified breadgit.workers.dev');
            }
          } else {
            if (!current.errors?.some(error => error.code === 10007)) throw new Error('Cannot read the account workers.dev setting. Check the Cloudflare credential permissions.');
            const created = await request('subdomain', { method: 'PUT', body: JSON.stringify({ subdomain: 'breadgit' }) });
            if (!created.success) throw new Error('Cannot register breadgit.workers.dev. Choose an available subdomain in Cloudflare Workers onboarding, then rerun this job.');
            console.log(`Registered ${created.result.subdomain}.workers.dev`);
          }
          JS
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
