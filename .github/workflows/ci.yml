name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A superseded run on a branch is cancelled; a release tag's run is not, because it may be deploying.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Pushes to main get the unit tests and the build; the browser suites run where a release
      # or review depends on them: tags, pull requests and manual runs.
      BROWSERS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ env.BROWSERS }}
      - run: npm test
      - run: npm run build
      - run: npm run test:browsers
        if: env.BROWSERS == 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          retention-days: 3
          if-no-files-found: error
  deploy:
    # A release is a v* tag on a main commit. Dispatching this workflow on a tag redeploys that release.
    name: Deploy
    needs: validate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist/
      - name: Confirm the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_REF_NAME points at a commit that is not on main (compare status: $status)"; exit 1 ;;
          esac
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
