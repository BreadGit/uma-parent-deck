name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A superseded run on a branch is cancelled; a release tag's run is not, because it may be deploying.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Pushes to main get the unit tests and the build; the browser suites run where a release
      # or review depends on them: tags, pull requests and manual runs.
      BROWSERS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ env.BROWSERS }}
      - run: npm test
      - run: npm run build
      - run: npm run test:browsers
        if: env.BROWSERS == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 3
          if-no-files-found: error
  deploy:
    # A release is a v* tag on a main commit. Dispatching this workflow on a tag redeploys that release.
    name: Deploy
    needs: validate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist/
      - name: Confirm the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_REF_NAME points at a commit that is not on main (compare status: $status)"; exit 1 ;;
          esac
      - run: npm run deploy -- --tag "$GITHUB_REF_NAME" --message "Release $GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
