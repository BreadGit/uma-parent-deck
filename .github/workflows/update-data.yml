name: Update game data
on:
  schedule:
    # About one and four hours after the daily 22:00 UTC release slot; scripts/data-refresh.ts decides whether a refresh is due.
    - cron: '7 23 * * *'
    - cron: '7 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: update-game-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - id: schedule
        run: node scripts/refresh-data.mjs --due
      # Includes Chromium: the fetch renders scanner references for new cards with it (scripts/scanner-artwork.mjs).
      - uses: ./.github/actions/setup
        if: steps.schedule.outputs.due == 'true'
      - id: refresh
        if: steps.schedule.outputs.due == 'true'
        run: npm run refresh:data
      - name: Validate refreshed data
        if: steps.refresh.outputs.changed == 'true'
        run: npm test && npm run build
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        if: steps.refresh.outputs.changed == 'true'
        id: pr
        with:
          branch: automation/update-game-data
          title: Update GameTora data
          commit-message: Update GameTora data
          author: BreadGit <58152441+BreadGit@users.noreply.github.com>
          committer: BreadGit <58152441+BreadGit@users.noreply.github.com>
          body: |
            Refresh the vendored GameTora snapshot, artwork and fitted model.

            The fetch pipeline and unit/data checks passed. CI verifies the browser flows before merge.
          add-paths: |
            data/
            public/assets/
            docs/umamusume/loopacord-card-data.csv
            docs/umamusume/fujikiseki-card-table.csv
            docs/umamusume/fujikiseki-card-table.json
      - name: Run CI on the data branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/update-game-data
      - name: Explain refresh failure
        if: failure()
        run: echo 'Data update failed. The published site is unchanged. Inspect the failed step; source/schema changes may need importer changes.' >> "$GITHUB_STEP_SUMMARY"
