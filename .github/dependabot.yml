# One grouped pull request a month per ecosystem; its CI run includes the browser suites.
version: 2
updates:
  # Actions are pinned by commit SHA, so nothing else updates them.
  - package-ecosystem: github-actions
    # The composite action pins actions too and is outside the workflows directory.
    directories: ['/', '/.github/actions/setup']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  # Major versions arrive as separate pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Follows the Node major in .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
