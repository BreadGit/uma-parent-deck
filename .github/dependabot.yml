# Actions are pinned by commit SHA, so nothing else updates them. One grouped pull request a month;
# its CI run includes the browser suites.
version: 2
updates:
  - package-ecosystem: github-actions
    # The composite action pins actions too and is outside the workflows directory.
    directories: ['/', '/.github/actions/setup']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
