name: Set up verification tools
description: Install the pinned runtimes, dependencies and browser used by CI and data updates.
inputs:
  browsers:
    description: Install Chromium for the browser suites and scanner artwork.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: analysis/requirements.txt
    - run: npm ci
      shell: bash
    - run: python -m pip install -r analysis/requirements.txt
      shell: bash
    - run: npx playwright install --with-deps chromium
      if: inputs.browsers == 'true'
      shell: bash
