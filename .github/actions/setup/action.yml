name: Set up verification tools
description: Install the pinned runtimes, dependencies and browser used by CI and data updates.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        cache: npm
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: analysis/requirements.txt
    - run: npm ci
      shell: bash
    - run: python -m pip install -r analysis/requirements.txt
      shell: bash
    - run: npx playwright install --with-deps chromium
      shell: bash
