name: Set up verification tools
description: Install the pinned runtimes, dependencies and browser used by CI and data updates.
inputs:
  browsers:
    description: Install Chromium for the browser suites and scanner artwork.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: analysis/requirements.txt
    - run: npm ci
      shell: bash
    - run: python -m pip install -r analysis/requirements.txt
      shell: bash
    - run: npx playwright install --with-deps chromium
      if: inputs.browsers == 'true'
      shell: bash
